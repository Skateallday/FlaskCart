name: Deploy to Production

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout production
        uses: actions/checkout@v3

      - name: Checkout app folder from master
        run: git fetch origin master && git checkout origin/master -- app/

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install and build
        run: |
          cd app
          npm install
          chmod +x node_modules/.bin/react-scripts
          npm run build

      - name: Copy build to server/static
        run: |
          rm -rf server/static/*
          mkdir -p server/static
          cp app/build/index.html server/static/
          cp app/build/asset-manifest.json server/static/
          cp app/build/manifest.json server/static/
          cp app/build/robots.txt server/static/
          cp app/build/favicon.ico server/static/
          cp -r app/build/static server/static/

      - name: Debug gitignore
        run: |
            cat .gitignore
            git check-ignore -v server/static/index.html

      - name: Commit and push static files
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -f server/static/
          git status
          git commit -m "Auto deploy $(date)" || echo "Nothing to commit"
          git push origin production

      - name: Reload PythonAnywhere
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Token ${{ secrets.PYTHONANYWHERE_TOKEN }}" \
            https://www.pythonanywhere.com/api/v0/user/${{ secrets.PYTHONANYWHERE_USERNAME }}/webapps/skateallday.pythonanywhere.com/reload/)
          if [ "$response" != "200" ]; then
            echo "Failed to reload PythonAnywhere, status code: $response"
            exit 1
          fi
          echo "Successfully reloaded PythonAnywhere!"